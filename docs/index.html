<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriVault - Jouw AI Voedingscoach</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            text-align: center;
            color: white;
        }
        .logo {
            width: 120px;
            height: 120px;
            background: white;
            border-radius: 30px;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }
        .tagline {
            font-size: 1.3em;
            opacity: 0.9;
            margin-bottom: 40px;
        }
        .features {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: left;
        }
        .feature {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .feature:last-child {
            margin-bottom: 0;
        }
        .feature-icon {
            font-size: 1.5em;
            margin-right: 15px;
        }
        .app-store {
            display: inline-block;
            background: black;
            color: white;
            padding: 15px 30px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 1.1em;
            margin: 10px;
            transition: transform 0.2s;
        }
        .app-store:hover {
            transform: scale(1.05);
        }
        .links {
            margin-top: 40px;
            opacity: 0.8;
        }
        .links a {
            color: white;
            margin: 0 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🥗</div>
        <h1>NutriVault</h1>
        <p class="tagline">Jouw AI Voedingscoach</p>

        <div class="features">
            <div class="feature">
                <span class="feature-icon">📸</span>
                <span>Maak een foto van je maaltijd</span>
            </div>
            <div class="feature">
                <span class="feature-icon">🤖</span>
                <span>AI analyseert automatisch wat je eet</span>
            </div>
            <div class="feature">
                <span class="feature-icon">📊</span>
                <span>Krijg direct calorieën en macro's</span>
            </div>
            <div class="feature">
                <span class="feature-icon">📈</span>
                <span>Volg je voortgang met grafieken</span>
            </div>
        </div>

        <a href="#" class="app-store">Download in App Store</a>

        <div class="links">
            <a href="privacy-policy.html">Privacy Policy</a>
            <a href="support.html">Support</a>
        </div>
    </div>
</body>
</html>
