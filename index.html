<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="NutriVault — Privacy-first nutrition & fitness tracking with AI-powered food logging" />
    <meta name="theme-color" content="#E07A5F" />
    <title>NutriVault</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <!-- iOS ignores SVG apple-touch-icons — use a real 180×180 PNG -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <!-- Fonts: preconnect + non-blocking stylesheet links instead of render-blocking @import -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" />
    <style>
      /* ── Warm Terra design tokens ─────────────────────────── */
      :root {
        --terra: #E07A5F;         /* primary: actions, active nav, FAB, gauge */
        --terra-dark: #C85A40;    /* pressed states, links, over-budget */
        --terra-tint: #FBEBE4;    /* soft terracotta chip/button backgrounds */
        --terra-track: #F6E4DB;   /* progress track behind terracotta fills */
        --wt-green: #3D5A48;      /* secondary: protein, water, success */
        --green-tint: #EFF2EE;
        --green-track: #EDF0EC;
        --sand: #D9964F;          /* carbs, burned accent */
        --sand-text: #C4763B;
        --sand-tint: #F6ECE2;
        --vet-text: #A8674F;
        --wt-bg: #FAF6F1;         /* app background */
        --wt-card: #FFFFFF;
        --ink: #2B2523;           /* primary text + dark chip bg */
        --ink-soft: #6B6257;
        --muted: #9A8B80;
        --faint: #B4A79C;
        --hairline: #F3EAE2;
        --bar-empty: #E8DFD5;

        /* legacy aliases kept so untouched styles keep working */
        --color-primary: var(--terra);
        --color-primary-dark: var(--terra-dark);
        --color-bg: var(--wt-bg);
        --color-card: var(--wt-card);
        --color-surface: var(--hairline);
        --font-display: 'Sora', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-body: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        height: 100%;
        height: 100dvh;
        width: 100%;
      }

      body {
        font-family: var(--font-body);
        background-color: var(--color-bg);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        overscroll-behavior: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        margin: 0;
        padding: 0;
        height: 100%;
        height: 100dvh;
        width: 100%;
        overflow: hidden;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        letter-spacing: -0.01em;
      }

      #root {
        height: 100%;
        height: 100dvh;
        width: 100%;
        display: flex;
        flex-direction: column;
      }

      /* Display font for headings */
      h1, h2, h3, .font-display {
        font-family: var(--font-display);
        letter-spacing: -0.025em;
      }

      /* Safe area utilities */
      .safe-area-top {
        padding-top: env(safe-area-inset-top, 0px);
      }
      .safe-area-bottom {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .safe-area-pb {
        padding-bottom: max(env(safe-area-inset-bottom, 0px), 8px);
      }

      /* Hide scrollbar */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .mask-linear {
        mask-image: linear-gradient(to right, black 85%, transparent 100%);
        -webkit-mask-image: linear-gradient(to right, black 85%, transparent 100%);
      }
      input, textarea {
        user-select: text;
        font-size: 16px;
      }

      /* Prevent layout shifts */
      .overflow-y-auto {
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
      }

      /* Modal backdrop scroll prevention */
      .fixed.inset-0 {
        overscroll-behavior: contain;
      }

      /* Warm Terra elevation */
      .card-shadow {
        box-shadow: 0 2px 10px rgba(66,48,39,0.05);
      }
      .hero-shadow {
        box-shadow: 0 8px 24px rgba(66,48,39,0.07);
      }
      .terra-shadow {
        box-shadow: 0 6px 14px rgba(224,122,95,0.35);
      }
      .terra-shadow-lg {
        box-shadow: 0 10px 24px rgba(224,122,95,0.4);
      }
      .nav-shadow {
        box-shadow: 0 -8px 30px rgba(66,48,39,0.08);
      }

      /* Glass effect for nav */
      .glass-nav {
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        background: rgba(255,255,255,0.92);
      }

      /* Animated progress fills (bars + ring gauge) */
      .anim-bar {
        transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .anim-ring {
        transition: stroke-dashoffset 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* Smooth transitions */
      .transition-smooth {
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }
    </style>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
